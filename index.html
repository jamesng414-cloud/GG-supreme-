<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOTO 周期实验室</title><style>body{font-family:system-ui;background:#0c1424;color:#edf2ff;margin:0;padding:22px}main{max-width:680px;margin:auto}h1{font-size:26px}.card{background:#19253b;padding:18px;border-radius:16px;margin:16px 0}textarea{width:100%;box-sizing:border-box;background:#0e1728;color:white;border:1px solid #52617b;border-radius:10px;padding:12px;font-size:15px;min-height:170px}button{background:#70a6ff;color:#081225;border:0;border-radius:10px;padding:13px 18px;font-weight:700;margin-top:12px}small,p{color:#c3cee0}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid #39465d;padding:9px;text-align:left}.error{color:#ff9c9c}strong{color:#a9ceff}</style></head><body><main><h1>🎯 TOTO 周期实验室</h1><p>历史开奖分布与五期模式回测 · V1</p><section class="card"><h3>输入历史号码</h3><p>按时间从旧到新，每行6个主号码，用逗号或空格分隔；不输入额外号码。</p><textarea id="draws" placeholder="例如：5,12,18,22,29,35&#10;21,28,33,39,44,48"></textarea><button id="run">分析数据</button><button id="demo" style="background:#cbd5e1">填入演示数据</button><p id="error" class="error"></p></section><section class="card"><h3>分类标准</h3><p>平均值 &lt; 20：小；20 至 &lt; 30：中；≥ 30：大。目标周期：<strong>大 → 大 → 中 → 大 → 小</strong>。</p></section><section class="card" id="results"><p>输入至少5期数据，然后点击「分析数据」。</p></section><small>仅用于统计研究。随机开奖彼此独立，历史模式不代表未来可预测。</small></main><script>const $=id=>document.getElementById(id);$('demo').onclick=()=>{$('draws').value='12,18,24,31,38,44\n19,25,32,37,42,49\n14,19,22,26,29,33\n18,27,34,39,43,47\n3,8,12,17,21,26';$('run').click()};$('run').onclick=()=>{const lines=$('draws').value.trim().split(/\n/).map(x=>x.trim()).filter(Boolean);const draws=lines.map(x=>x.split(/[\s,，]+/).map(Number));if(draws.length<5||draws.some(a=>a.length!==6||a.some(n=>!Number.isInteger(n)||n<1||n>49)||new Set(a).size!==6)){$('error').textContent='请至少输入5期，每期6个不重复的1–49整数。';return}$('error').textContent='';const rows=draws.map((a,i)=>{let avg=a.reduce((s,n)=>s+n,0)/6;return {i:i+1,avg,cat:avg<20?'小':avg<30?'中':'大'}});const seq=rows.map(r=>r.cat),pat=['大','大','中','大','小'];let matches=0;for(let i=0;i<=seq.length-5;i++)if(pat.every((p,j)=>seq[i+j]===p))matches++;const counts={小:0,中:0,大:0};seq.forEach(c=>counts[c]++);$('results').innerHTML='<h3>分析结果</h3><p>共 '+rows.length+' 期 · 完整周期出现 <strong>'+matches+'</strong> 次（共 '+(rows.length-4)+' 个五期窗口）</p><p>小：'+counts.小+' 期 ｜ 中：'+counts.中+' 期 ｜ 大：'+counts.大+' 期</p><p>走势：'+seq.join(' → ')+'</p><table><thead><tr><th>期序</th><th>平均值</th><th>分类</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+r.i+'</td><td>'+r.avg.toFixed(2)+'</td><td>'+r.cat+'</td></tr>').join('')+'</tbody></table>'}};</script></body></html>
